<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>GameHive | Orders</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>GameHive Orders</h1>
            <a href="/products" class="btn btn-secondary">Back to Products</a>
        </div>

        <!-- Place an ordering the order which is tied to the @RequestParams -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Place an Order</h5>
                <form th:action="@{/orders}" method="post" class="row g-3 align-items-end">

                    <div class="col-md-4">
                        <label class="form-label">User</label>
                        <select name="userId" class="form-select" required>
                            <!-- value is the id, text is what the person sees -->
                            <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.username}"></option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Product</label>
                        <select name="productId" class="form-select" required>
                            <option th:each="p : ${products}" th:value="${p.id}"
                                    th:text="${p.name + ' ($' + p.price + ')'}"></option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Quantity</label>
                        <input type="number" name="quantity" min="1" value="1" class="form-control" required>
                    </div>

                    <div class="col-md-2">
                        <button type="submit" class="btn btn-success w-100">Place Order</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- List of all orders -->
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Order #</th>
                    <th>User</th>
                    <th>Product</th>
                    <th>Quantity</th>
                    <th>Order Date</th>
                </tr>
            </thead>
            <tbody>
                <!-- o.user and o.product work because of @ManyToOne in Order.java -->
                <tr th:each="o : ${orders}">
                    <td th:text="${o.id}"></td>
                    <td th:text="${o.user.username}"></td>
                    <td th:text="${o.product.name}"></td>
                    <td th:text="${o.quantity}"></td>
                    <td th:text="${#temporals.format(o.orderDate, 'MM/dd/yyyy h:mm a')}"></td>
                </tr>

                <!-- Shows only when the list is empty -->
                <tr th:if="${#lists.isEmpty(orders)}">
                    <td colspan="5" class="text-center text-muted">No orders yet. Place one!</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>

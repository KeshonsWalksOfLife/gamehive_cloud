<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <title>GameHive | Register</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body class="container py-4" style="max-width: 600px;">
    
    	<div th:replace="~{fragments/navbar :: navbar}"></div>

        <h1 class="mb-4">Create Account</h1>

        <!-- The controller binds a user from the controller -->
        <form th:action="@{/users/register}" th:object="${user}" method="post">

            <!-- The user fields to set -->
            <div class="row">
                <div class="col mb-3">
                    <label class="form-label">First Name</label>
                    <input type="text" th:field="*{firstName}" class="form-control" maxlength="50" required>
                </div>
                <div class="col mb-3">
                    <label class="form-label">Last Name</label>
                    <input type="text" th:field="*{lastName}" class="form-control" maxlength="50" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <!-- type="email" makes the browser check the format -->
                <input type="email" th:field="*{email}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" th:field="*{username}" class="form-control" maxlength="100" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" th:field="*{password}" class="form-control" maxlength="100" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Date of Birth</label>
                <!-- the date "date" sends yyyy-MM-dd, which @DateTimeFormat reads into LocalDate -->
                <input type="date" th:field="*{dateOfBirth}" class="form-control">
            </div>

            <button type="submit" class="btn btn-success">Register</button>
            <a href="/products" class="btn btn-secondary">Cancel</a>
        </form>

    </body>
</html>

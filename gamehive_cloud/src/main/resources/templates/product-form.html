<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GameHive | Add Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4" style="max-width: 600px;">

    <h1 class="mb-4">Add Product</h1>

    <!-- th:object binds the form to the empty Product from the Controller -->
    <form th:action="@{/products}" th:object="${product}" method="post">

        <!-- th:field must match the Product field names exactly -->
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" th:field="*{name}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Category</label>
            <select th:field="*{category}" class="form-select" required>
                <option value="Game">Game</option>
                <option value="Console">Console</option>
                <option value="Accessory">Accessory</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Platform</label>
            <input type="text" th:field="*{platform}" class="form-control" placeholder="PS5, Xbox, Switch...">
        </div>

        <div class="mb-3">
            <label class="form-label">Price</label>
            <!-- step 0.01 allows cents -->
            <input type="number" step="0.01" min="0" th:field="*{price}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Stock</label>
            <input type="number" min="0" th:field="*{stock}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">ESRB Rating</label>
            <select th:field="*{esrbRating}" class="form-select">
                <option value="E">E</option>
                <option value="T">T</option>
                <option value="M">M</option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">Save</button>
        <a href="/products" class="btn btn-secondary">Cancel</a>
    </form>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
	    <meta charset="UTF-8">
	    <title>GameHive | Products</title>
	    <!-- Bootstrap from CDN for styling -->
	    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	</head>
	<body class="container py-4">

		<div th:replace="~{fragments/navbar :: navbar}"></div>
		
	    <div class="d-flex justify-content-between align-items-center mb-3">
	        <h1>GameHive Products</h1>
	        <a href="/products/new" class="btn btn-primary"> Add Product</a>
	    </div>
	
	    <table class="table table-striped">
	        <thead>
	            <tr>
	                <th>Name</th>
	                <th>Category</th>
	                <th>Platform</th>
	                <th>Price</th>
	                <th>Stock</th>
	                <th>ESRB</th>
	                <th>Actions</th>
	            </tr>
	        </thead>
	        <tbody>
	            <!-- loops over the products list from the Controller -->
	            <tr th:each="p : ${products}">
	                <td th:text="${p.name}"></td>
	                <td th:text="${p.category}"></td>
	                <td th:text="${p.platform}"></td>
	                <td th:text="${'$' + p.price}"></td>
	                <td th:text="${p.stock}"></td>
	                <td th:text="${p.esrbRating}"></td>
	              	<td class="d-flex gap-2">
	      				<a th:href="@{/products/{id}/edit(id=${p.id})}" class="btn btn-sm btn-warning">Edit</a>
	      				<form th:action="@{/products/{id}/delete(id=${p.id})}" method="post"
	            			onsubmit="return confirm('Delete this product?');">
	          				<button type="submit" class="btn btn-sm btn-danger">Delete</button>
	      				</form>
	  				</td>
	            </tr>
	            
	            <!-- Shows only when the list is empty -->
	            <tr th:if="${#lists.isEmpty(products)}">
	                <td colspan="7" class="text-center text-muted">No products yet. Add one!</td>
	            </tr>
	        </tbody>
	    </table>
	</body>
</html>
